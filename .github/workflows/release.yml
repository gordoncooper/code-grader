# Tags and releases each suite version when its bundle PR merges.
# The version comes from bundle/web/manifest.json (and must match the top of bundle/bare/CHANGELOG.md).
# The tag goes on the commit that brought the version in (the bundle PR's merge commit).
# Versions that are already tagged are skipped, so other changes to bundle/ don't release anything.
#
# Each release has SHA256SUMS, and its zips are signed with build provenance (Sigstore, keyless, through
# GitHub's OIDC token): anyone can check a download with `gh attestation verify FILE --repo OWNER/REPO`.
#
# To release a version by hand (for example one merged before this workflow existed):
#   Actions → Release suite → Run workflow, optionally with the commit to release.
name: Release suite

on:
  push:
    branches: [main]
    paths: ["bundle/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to release. Leave empty for the newest version on main."
        required: false
        default: ""

permissions:
  contents: write      # tag and release
  id-token: write      # sign the build provenance (Sigstore, keyless)
  attestations: write  # store the provenance with the repository

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the release files
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.ref }}
          STAGE_DIR: ${{ runner.temp }}/release
        run: |
          bash .github/scripts/release.sh | tee "$RUNNER_TEMP/stage.log"
          grep '^tag=' "$RUNNER_TEMP/stage.log" >> "$GITHUB_OUTPUT" || true

      - name: Sign them (build provenance)
        if: steps.stage.outputs.tag != ''
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/release/*.zip

      - name: Release
        if: steps.stage.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DIR: ${{ runner.temp }}/release
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          [ -z "$BUNDLE" ] || cp "$BUNDLE" "$PUBLISH_DIR/code-grading-suite-${{ steps.stage.outputs.tag }}.intoto.jsonl"
          bash .github/scripts/release.sh
