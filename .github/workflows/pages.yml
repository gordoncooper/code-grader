# Publishes the Code Grading Suite website to GitHub Pages: bundle/web/ at the root, and every major version
# at its own path (/v4/, /v5/ …) from the release tags, with versions.json (see .github/scripts/site_versions.py).
# Runs when bundle/web/ or the site builder changes on main, or by hand from the Actions tab.
# One-time setup: Settings → Pages → Source: GitHub Actions (needs admin on this repo).
name: Publish website

on:
  push:
    branches: [main]
    paths: ["bundle/web/**", ".github/scripts/site_versions.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # the release tags, for the older major versions

      - name: Check the site is there
        id: check
        run: |
          if [ -f bundle/web/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle/web/index.html not found; nothing to publish yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble every version (each checked against its SHA256SUMS)
        if: steps.check.outputs.ready == 'true'
        run: python3 .github/scripts/site_versions.py _site

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.check.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
