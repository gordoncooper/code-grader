# The kit's test suite: gradekit and its command line, then the website in a real browser.
# See tests/README.md.
name: Tests

on:
  pull_request:
    paths: ["source/**", "tests/**", ".github/scripts/**", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["source/**", "tests/**", ".github/scripts/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: gradekit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -m "not browser" -q -p no:cacheprovider

  website:
    name: website (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pages, links and layout (test engine, no network)
        run: python -m pytest tests -m "browser and not network" -q -p no:cacheprovider
      - name: Plain static host with the real Pyodide engine
        run: python -m pytest tests -m network -q -p no:cacheprovider
