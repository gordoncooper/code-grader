# Code Grading Suite (v4.2.1): project configuration
# People own this file. Agents read it but don't change it.
# Answers to decision questions go in decisions.json, accepted findings in dispositions.json.
# Check it with:  python3 SUITE_DIR/tools/gradekit.py resolve --config projects/<name>/project.toml
# Or use the "Set up a project" page on the suite's website.

[project]
name            = "schedule"
description     = "Python job scheduling for humans: run functions periodically with a friendly API."
code_repo       = "https://github.com/dbader/schedule"   # where the code lives (informational)
suite           = "5"
preset          = "oss_library"   # default | service | web_app | library | oss_library | cli | internal_tool | prototype
languages       = "Python"
users           = "Python developers who embed it in scripts and services"

# Answers override the preset. Each one moves specific weights; see `gradekit resolve --explain ID`.
[answers]
data_sensitivity  = "none"   # What is the most sensitive data this code handles? (none | internal | personal | financial | regulated)
audience          = "developers"   # Who uses it? (just_me | team | internal_org | public | developers)
lifespan          = "indefinite"   # How long will this code live? (throwaway | months | years | indefinite)
failure_impact    = "degraded_work"   # What happens when it fails? (inconvenience | degraded_work | revenue_loss | safety_or_legal)
team              = "open_source"   # Who works on it? (solo | small | large | open_source)
change_rate       = "rare"   # How often does it change? (rare | regular | constant)
delivery          = "package"   # How is it delivered? (mixed | service | website | package | installed_app | internal_script)
scale             = "small"   # What load or data volume does it face? (small | moderate | large | massive)

# Criticality zones: the first match wins, so list specific zones first.
# hot = matters most (money, auth, data writes); cold = matters least (scripts, examples).

[[zones]]
name        = "scheduler-core"
paths       = ["schedule/__init__.py"]
criticality = "hot"
why         = "All scheduling logic: job timing, next-run computation, timezones"

[[zones]]
name        = "docs"
paths       = ["docs/**"]
criticality = "cold"
why         = "Sphinx documentation sources"

# Where improving agents stop: proportional (default) | maximal | level:L3
[targets]
mode = "proportional"
# overrides = { F4 = 10 }

# Explicit weight overrides (each needs a reason).
# [weights.overrides]
# F4 = { weight = 3, reason = "Contractual p99 latency SLA" }

# Extra gates for this project, or (rarely) remove one:
# [gates]
# extra   = ["C4"]
# exclude = []

# Let agent reviewers approve decision questions (default: humans only):
# [review]
# allow_agent_decisions = true
