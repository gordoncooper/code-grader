# Code Grading Suite: project configuration for a calibration golden repo
# People own this file. Agents read it but don't change it.
# Check it with:  python3 SUITE_DIR/tools/gradekit.py resolve --config projects/<name>/project.toml

[project]
name            = "hexyl"
description     = "A command-line hex viewer: colored output that separates byte categories, with offsets, panels and squeezing of repeated lines."
code_repo       = "https://github.com/sharkdp/hexyl"   # where the code lives (informational)
suite           = "6"
preset          = "cli"   # default | service | web_app | library | oss_library | cli | internal_tool | prototype
languages       = "Rust"
users           = "Developers and sysadmins who inspect binary files in a terminal"

# Answers override the preset. Each one moves specific weights; see `gradekit resolve --explain ID`.
[answers]
data_sensitivity  = "none"   # What is the most sensitive data this code handles? (none | internal | personal | financial | regulated)
audience          = "developers"   # Who uses it? (just_me | team | internal_org | public | developers)
lifespan          = "years"   # How long will this code live? (throwaway | months | years | indefinite)
failure_impact    = "inconvenience"   # What happens when it fails? (inconvenience | degraded_work | revenue_loss | safety_or_legal)
team              = "open_source"   # Who works on it? (solo | small | large | open_source)
change_rate       = "rare"   # How often does it change? (rare | regular | constant)
delivery          = "installed_app"   # How is it delivered? (mixed | service | website | package | installed_app | internal_script)
scale             = "moderate"   # What load or data volume does it face? (small | moderate | large | massive)

# Criticality zones: the first match wins, so list specific zones first.
# hot = matters most (money, auth, data writes); cold = matters least (scripts, examples).

[[zones]]
name        = "printer"
paths       = ["src/lib.rs"]
criticality = "hot"
why         = "Formats every byte: offsets, panels, squeezing, colors and borders"

[[zones]]
name        = "docs-and-examples"
paths       = ["doc/**", "examples/**"]
criticality = "cold"
why         = "The man page source, the logo and a library usage example"

# Where improving agents stop: proportional (default) | maximal | level:L3
[targets]
mode = "proportional"
