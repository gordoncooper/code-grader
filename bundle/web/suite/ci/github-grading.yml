# Grading check for a grading repo on GitHub. Save as .github/workflows/grading.yml
# (`gradekit init --ci github` does it).
#   check: on each pull request that changes projects/ or org.toml, checks it with `gradekit ci`,
#          comments a summary and sets labels.
#   decide: when someone ticks a box in a report pull request's "Decisions needed" checklist, records the answer
#           in that project's decisions.json on the pull request's branch, under their GitHub login.
#   index: when reports or decisions land on the default branch, rebuilds projects/index.json and commits it.
#   schedule: every Monday (and on demand: Actions → Grading check → Run workflow), asks for a grade for each
#             project that's due under its [schedule] in project.toml: one pull request per project, adding a
#             grade work order. Whoever runs graders picks open orders up with `gradekit order list`.
#
# The kit is pinned: GRADEKIT_URL and GRADEKIT_SHA256 below name one exact kit zip, and every job refuses any
# other. Nothing changes until you change it: `gradekit ci-pin --version X.Y.Z` (or run a new kit's
# `gradekit init --ci github --force`, which also brings that version's template).
# Settings → Secrets and variables → Actions → Variables: SUITE_SITE = your suite website's address (for the
# Review links in comments only; the kit doesn't come from it).
# Permissions: the default GITHUB_TOKEN with each job's `permissions` below. Pull requests from forks get
# a read-only token: they're checked, but not commented on. If the default branch is protected so that
# nothing can be pushed to it directly, allow GitHub Actions to bypass that rule, or delete the index job
# (the Review page then reads each project's reports itself).
# Who can answer by ticking: anyone who can edit the pull request's description, which is people with write access
# and the pull request's author. Pull requests from forks are skipped. Commits made with GITHUB_TOKEN don't start
# workflows, so the check job doesn't re-run on the decide job's commit; `gradekit decide` checks each answer itself.
# The schedule job needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# To tell whether private code has changed, add a CODE_READ_TOKEN secret that can read the code repos (a fine-grained
# token with Contents: read); without it, only public code repos are checked. GitHub pauses schedules in a public
# repository after 60 days without activity.
name: Grading check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["projects/**", "org.toml"]
  push:
    paths: ["projects/**", "org.toml"]
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADEKIT_VERSION: "__KIT_VERSION__"
  GRADEKIT_URL: "__KIT_URL__"
  GRADEKIT_SHA256: "__KIT_SHA256__"

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      SUITE_SITE: ${{ vars.SUITE_SITE || '__SUITE_SITE__' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the grading kit
        run: |
          curl -fsSL "$GRADEKIT_URL" -o "$RUNNER_TEMP/kit.zip"
          echo "$GRADEKIT_SHA256  $RUNNER_TEMP/kit.zip" | sha256sum --check --quiet - || { echo "the kit at $GRADEKIT_URL isn't the pinned one ($GRADEKIT_VERSION); not using it"; exit 1; }
          python3 -c 'import sys, zipfile, pathlib; z = zipfile.ZipFile(sys.argv[1]); bad = [n for n in z.namelist() if n.startswith("/") or ".." in pathlib.PurePosixPath(n).parts]; sys.exit(f"unsafe path in the kit: {bad[0]}") if bad else z.extractall(sys.argv[2])' "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/kit"
          echo "KIT=$(dirname "$(dirname "$(find "$RUNNER_TEMP/kit" -path '*/tools/gradekit.py' | head -1)")")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet "jsonschema>=4.18,<5"   # the reports' structural check; without it, only semantic checks run

      - name: Check the change
        id: check
        continue-on-error: true
        run: |
          python3 "$KIT/tools/gradekit.py" ci --base "origin/${{ github.base_ref }}" \
            --site "$SUITE_SITE" --grading-repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --branch "${{ github.head_ref }}" --comment-file "$RUNNER_TEMP/comment.md" --labels-file "$RUNNER_TEMP/labels.txt"

      - name: Comment and label
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/comment.md" ] || exit 0
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/comment.md" 2>/dev/null \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          for label in "grading: report" "grading: settings" "grading: needs changes"; do
            if grep -qxF "$label" "$RUNNER_TEMP/labels.txt"; then
              gh label create "$label" --color 5319e7 --force >/dev/null
              gh pr edit "$PR" --add-label "$label"
            else
              gh pr edit "$PR" --remove-label "$label" 2>/dev/null || true
            fi
          done

      - name: Result
        if: steps.check.outcome == 'failure'
        run: exit 1

  decide:
    # Only when the description changed, on a pull request from this repository, edited by a person.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.body &&
      github.event.pull_request.head.repo.full_name == github.repository && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: grading-decide-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      SUITE_SITE: ${{ vars.SUITE_SITE || '__SUITE_SITE__' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the grading kit
        run: |
          curl -fsSL "$GRADEKIT_URL" -o "$RUNNER_TEMP/kit.zip"
          echo "$GRADEKIT_SHA256  $RUNNER_TEMP/kit.zip" | sha256sum --check --quiet - || { echo "the kit at $GRADEKIT_URL isn't the pinned one ($GRADEKIT_VERSION); not using it"; exit 1; }
          python3 -c 'import sys, zipfile, pathlib; z = zipfile.ZipFile(sys.argv[1]); bad = [n for n in z.namelist() if n.startswith("/") or ".." in pathlib.PurePosixPath(n).parts]; sys.exit(f"unsafe path in the kit: {bad[0]}") if bad else z.extractall(sys.argv[2])' "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/kit"
          echo "KIT=$(dirname "$(dirname "$(find "$RUNNER_TEMP/kit" -path '*/tools/gradekit.py' | head -1)")")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet "jsonschema>=4.18,<5"   # the reports' structural check; without it, only semantic checks run

      - name: Record ticked answers
        env:
          # The description is untrusted text: it reaches the shell only through this variable, never inline.
          BODY: ${{ github.event.pull_request.body }}
          BY: ${{ github.event.sender.login }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"
          grep -q '<!-- gradekit:project=' "$RUNNER_TEMP/body.md" || { echo "not a report pull request"; exit 0; }
          python3 "$KIT/tools/gradekit.py" decide --from-checklist "$RUNNER_TEMP/body.md" --by "$BY"
          git add projects/*/decisions.json projects/*/reports/*/report.md
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Record decisions ticked by $BY"
          git pull --rebase -q origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"

  index:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUITE_SITE: ${{ vars.SUITE_SITE || '__SUITE_SITE__' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the grading kit
        run: |
          curl -fsSL "$GRADEKIT_URL" -o "$RUNNER_TEMP/kit.zip"
          echo "$GRADEKIT_SHA256  $RUNNER_TEMP/kit.zip" | sha256sum --check --quiet - || { echo "the kit at $GRADEKIT_URL isn't the pinned one ($GRADEKIT_VERSION); not using it"; exit 1; }
          python3 -c 'import sys, zipfile, pathlib; z = zipfile.ZipFile(sys.argv[1]); bad = [n for n in z.namelist() if n.startswith("/") or ".." in pathlib.PurePosixPath(n).parts]; sys.exit(f"unsafe path in the kit: {bad[0]}") if bad else z.extractall(sys.argv[2])' "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/kit"
          echo "KIT=$(dirname "$(dirname "$(find "$RUNNER_TEMP/kit" -path '*/tools/gradekit.py' | head -1)")")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet "jsonschema>=4.18,<5"   # the reports' structural check; without it, only semantic checks run

      - name: Rebuild projects/index.json
        run: |
          python3 "$KIT/tools/gradekit.py" index
          git add projects/index.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update projects/index.json [skip ci]"
          git push

  schedule:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SUITE_SITE: ${{ vars.SUITE_SITE || '__SUITE_SITE__' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the grading kit
        run: |
          curl -fsSL "$GRADEKIT_URL" -o "$RUNNER_TEMP/kit.zip"
          echo "$GRADEKIT_SHA256  $RUNNER_TEMP/kit.zip" | sha256sum --check --quiet - || { echo "the kit at $GRADEKIT_URL isn't the pinned one ($GRADEKIT_VERSION); not using it"; exit 1; }
          python3 -c 'import sys, zipfile, pathlib; z = zipfile.ZipFile(sys.argv[1]); bad = [n for n in z.namelist() if n.startswith("/") or ".." in pathlib.PurePosixPath(n).parts]; sys.exit(f"unsafe path in the kit: {bad[0]}") if bad else z.extractall(sys.argv[2])' "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/kit"
          echo "KIT=$(dirname "$(dirname "$(find "$RUNNER_TEMP/kit" -path '*/tools/gradekit.py' | head -1)")")" >> "$GITHUB_ENV"
          python3 -m pip install --quiet "jsonschema>=4.18,<5"   # the reports' structural check; without it, only semantic checks run

      - name: Ask for the grades that are due
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_READ_TOKEN: ${{ secrets.CODE_READ_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$CODE_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${CODE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          python3 "$KIT/tools/gradekit.py" due --check-code --write-orders | tee "$RUNNER_TEMP/due.txt"
          day=$(date -u +%F)
          for proj in $(git status --porcelain --untracked-files=all -- projects | sed -n 's#^?? projects/\([^/]*\)/orders/.*#\1#p' | sort -u); do
            branch="orders/$proj/schedule-$day"
            git switch -q -c "$branch" "origin/$BASE"
            git add "projects/$proj/orders"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Scheduled grade for $proj"
            git push -q origin "$branch"
            { echo "**$proj** is due for a grade under its \`[schedule]\`:"; echo
              grep "^due  $proj:" "$RUNNER_TEMP/due.txt" | sed 's/^due  /- /'
              echo; echo "Merging records the request as a work order. Whoever runs graders picks it up with \`gradekit order list\`,"
              echo "and the report that answers it closes it."; } > "$RUNNER_TEMP/body.md"
            gh pr create --base "$BASE" --head "$branch" --title "Scheduled grade: $proj ($day)" --body-file "$RUNNER_TEMP/body.md"
            git switch -q "$BASE"
          done
