# Project config for the bundled sample repo. It lives in .grading/ (in-repo mode).

[project]
name            = "orders-api"
description     = "Small internal orders API (example only)"
preset          = "service"
languages       = "Python"
users           = "Internal sales tools"
maturity_target = "production"
scope           = "Create orders, take idempotent payments, export orders"
out_of_scope    = []

[answers]
data_sensitivity = "financial"   # takes payments

[[zones]]
name        = "payments"
paths       = ["src/payments/**"]
criticality = "hot"
why         = "Moves money"

[[zones]]
name        = "orders"
paths       = ["src/orders/**"]
criticality = "hot"
why         = "Order totals are billed to customers"

[[zones]]
name        = "scripts"
paths       = ["scripts/**", "tests/**"]
criticality = "cold"
why         = "Developer convenience; never runs in production"

[targets]
mode = "proportional"

[[dispositions]]
finding_id = "B5-001"
decision   = "won't fix"
reason     = "One payment provider is a deliberate business constraint through 2027"
decided_by = "jane@example.com"
date       = "2026-11-07"
